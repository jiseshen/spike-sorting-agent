# Setting 001: Low-noise, no drift, no overlap — clean baseline
# Teacher style: strict (high SNR, low ISI tolerance)

setting_id: setting_001

simulation:
  n_channels: 20
  duration: 120           # seconds
  n_neurons_range: [5, 15]
  probe: "Neuronexus-32"
  seed: 42

noise:
  level: "low"
  noise_level: 10.0       # uV RMS

drift:
  enabled: false
  drift_velocity: 0.0

overlap:
  enabled: false
  max_overlap_pairs: 0

artifact:
  type: "none"            # none | periodic | burst

teacher_criteria:
  min_spike_count: 500
  max_isi_violation_rate: 0.005
  require_biphasic: true
  min_snr: 4.0
  teacher_style: "strict"

adaptation:
  n_train_channels: 12
  n_eval_channels: 5
  split_seed: 0

sorter:
  name: "mountainsort5"
  detect_threshold: 5.5
  snippet_T1: 20
  snippet_T2: 20

hierarchy:
  enabled: true
  similarity_metric: "pearson"
  min_similarity: 0.92
  max_merges: null
