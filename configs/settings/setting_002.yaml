# Setting 002: Medium noise, with drift, some overlap
# Teacher style: liberal (tolerant of mild ISI violations)

setting_id: setting_002

simulation:
  n_channels: 20
  duration: 120
  n_neurons_range: [8, 20]
  probe: "Neuronexus-32"
  seed: 123

noise:
  level: "medium"
  noise_level: 20.0       # uV RMS

drift:
  enabled: true
  drift_velocity: 5.0     # um/min

overlap:
  enabled: true
  max_overlap_pairs: 3

artifact:
  type: "none"

teacher_criteria:
  min_spike_count: 300
  max_isi_violation_rate: 0.015
  require_biphasic: false
  min_snr: 2.5
  teacher_style: "liberal"

adaptation:
  n_train_channels: 12
  n_eval_channels: 5
  split_seed: 1

sorter:
  name: "mountainsort5"
  detect_threshold: 5.0
  snippet_T1: 20
  snippet_T2: 20

hierarchy:
  enabled: true
  similarity_metric: "pearson"
  min_similarity: 0.90
  max_merges: null
